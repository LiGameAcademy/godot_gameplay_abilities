name: GAS runtime validation
on:
  pull_request:
  push:
    branches: [master, 'fix/**']
permissions:
  contents: read
jobs:
  runtime:
    name: GAS runtime contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot 4.7.2
        run: |
          official_url='https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2'
          release_url='https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          if ! curl --fail --show-error --location --connect-timeout 10 --max-time 90 --retry 1 --output /tmp/godot.zip "$official_url"; then
            curl --fail --show-error --location --connect-timeout 10 --max-time 90 --retry 1 --output /tmp/godot.zip "$release_url"
          fi
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version | grep -E '^4\.7\.2\.stable\.'
      - name: Validate runtime contracts
        run: python tests/run_runtime.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
