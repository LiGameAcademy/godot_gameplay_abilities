name: GAS runtime validation
on:
  pull_request:
  push:
    branches: [master, 'fix/**']
permissions:
  contents: read
jobs:
  runtime:
    name: ${{ matrix.check_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - godot: '4.7.2'
            check_name: GAS runtime contracts
          - godot: '4.5'
            check_name: GAS runtime contracts (Godot 4.5)
    env:
      GODOT_VERSION: ${{ matrix.godot }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot
        run: |
          official_url="https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=$GODOT_VERSION"
          release_url="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          if ! curl --fail --show-error --location --connect-timeout 10 --max-time 90 --retry 1 --output /tmp/godot.zip "$official_url"; then
            curl --fail --show-error --location --connect-timeout 10 --max-time 90 --retry 1 --output /tmp/godot.zip "$release_url"
          fi
          unzip -q /tmp/godot.zip -d /tmp/godot
          godot_bin="/tmp/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64"
          chmod +x "$godot_bin"
          version="$("$godot_bin" --version)"
          case "$version" in
            "$GODOT_VERSION".stable.*) ;;
            *) echo "Unexpected Godot version $version"; exit 1 ;;
          esac
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
      - name: Validate runtime contracts
        run: python tests/run_runtime.py --godot "$GODOT_BIN"
