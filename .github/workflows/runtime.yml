name: GAS runtime validation
on:
  pull_request:
  push:
    branches: [master, 'fix/**']
permissions:
  contents: read
jobs:
  runtime:
    name: GAS runtime contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Validate runtime contracts
        run: python tests/run_runtime.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
